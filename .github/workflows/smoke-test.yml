name: Smoke Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install tap and smoke-test harness
        run: |
          python -m venv .venv
          source .venv/bin/activate
          # This SDK's fs dependency still imports pkg_resources.
          pip install . hotglue-smoke-test 'setuptools<81'
      - name: Replay colocated smoke tests
        run: |
          source .venv/bin/activate
          hotglue-smoke-test run
